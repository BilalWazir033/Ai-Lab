<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitty Keys - Typing Fun!</title>
    <style>
        :root {
            --sky-blue: #a2d2ff;
            --grass-green: #9edb86;
            --cat-orange: #ff9f1c;
            --accent-pink: #ffafcc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            background-color: var(--sky-blue);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: linear-gradient(to bottom, #a2d2ff 0%, #a2d2ff 70%, var(--grass-green) 100%);
            border: 8px solid white;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            margin-top: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .word {
            position: absolute;
            background: white;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            user-select: none;
            transition: transform 0.1s;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 20px;
            border: 3px solid var(--accent-pink);
        }

        /* Input Area */
        #input-container {
            width: 100%;
            max-width: 616px;
            background: white;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #word-input {
            font-size: 30px;
            padding: 10px 20px;
            border: 4px solid var(--cat-orange);
            border-radius: 15px;
            width: 300px;
            text-align: center;
            outline: none;
        }

        /* Mascot - CSS Cat */
        #mascot-container {
            position: absolute;
            bottom: 20px;
            right: 30px;
            width: 100px;
            height: 100px;
            z-index: 10;
        }

        .cat {
            position: relative;
            width: 80px;
            height: 60px;
            background: var(--cat-orange);
            border-radius: 40px 40px 10px 10px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cat::before { /* Ears */
            content: '';
            position: absolute;
            top: -15px; left: 10px;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid var(--cat-orange);
        }

        .cat::after { /* Ears */
            content: '';
            position: absolute;
            top: -15px; right: 10px;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid var(--cat-orange);
        }

        .eyes {
            position: absolute;
            top: 20px; left: 15px; right: 15px;
            display: flex; justify-content: space-between;
        }

        .eye {
            width: 12px; height: 12px;
            background: #333;
            border-radius: 50%;
        }

        .mouth {
            position: absolute;
            bottom: 15px; left: 35px;
            width: 10px; height: 5px;
            border-bottom: 3px solid #333;
            border-radius: 50%;
        }

        /* Animations */
        @keyframes jump {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.1) rotate(5deg); }
        }

        .cheer {
            animation: jump 0.5s ease;
        }

        #speech-bubble {
            position: absolute;
            top: -50px;
            left: -20px;
            background: white;
            padding: 5px 10px;
            border-radius: 10px;
            border: 2px solid #333;
            font-size: 14px;
            display: none;
        }

        /* Screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(162, 210, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            background: var(--cat-orange);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #e67e22;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #e67e22;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div class="stat-box">Score: <span id="score">0</span></div>
            <div class="stat-box">Level: <span id="level">1</span></div>
        </div>

        <div id="mascot-container">
            <div id="speech-bubble">Great job!</div>
            <div id="pixel-cat" class="cat">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth"></div>
            </div>
        </div>

        <div id="start-screen" class="overlay">
            <h1 style="font-size: 48px; color: white; -webkit-text-stroke: 2px #333;">Kitty Keys!</h1>
            <p style="font-size: 20px;">Type the words before they hit the grass!</p>
            <button id="start-btn">Play Game!</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 style="font-size: 40px; color: #d63031;">Oops! Game Over</h1>
            <p id="final-score" style="font-size: 24px;"></p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="word-input" placeholder="Type here..." autocomplete="off">
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const wordInput = document.getElementById('word-input');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const pixelCat = document.getElementById('pixel-cat');
        const speechBubble = document.getElementById('speech-bubble');

        // Word levels for 7-year-olds
        const wordList = {
            1: ['cat', 'dog', 'hat', 'run', 'sun', 'red', 'big', 'sit'],
            2: ['frog', 'blue', 'tree', 'jump', 'fish', 'bird', 'fast', 'play'],
            3: ['apple', 'green', 'water', 'happy', 'house', 'small', 'bread', 'table'],
            4: ['school', 'friend', 'yellow', 'animal', 'garden', 'window', 'please', 'family'],
            5: ['because', 'around', 'before', 'always', 'together', 'children', 'favorite', 'morning']
        };

        const cheers = ["Nice!", "Wow!", "Fast!", "Cool!", "Purr-fect!"];

        let score = 0;
        let level = 1;
        let words = [];
        let gameActive = false;
        let spawnRate = 2500; // milliseconds
        let lastSpawn = 0;
        let fallSpeed = 1.2;

        function start() {
            score = 0;
            level = 1;
            spawnRate = 2500;
            fallSpeed = 1.2;
            words.forEach(w => w.element.remove());
            words = [];
            
            scoreDisplay.innerText = score;
            levelDisplay.innerText = level;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameActive = true;
            wordInput.focus();
            
            requestAnimationFrame(update);
        }

        function spawnWord() {
            const currentLevelWords = wordList[Math.min(level, 5)];
            const text = currentLevelWords[Math.floor(Math.random() * currentLevelWords.length)];
            
            const element = document.createElement('div');
            element.className = 'word';
            element.innerText = text;
            
            // Random horizontal position
            const x = Math.random() * (gameContainer.clientWidth - 150) + 20;
            element.style.left = x + 'px';
            element.style.top = '-50px';
            
            gameContainer.appendChild(element);
            
            words.push({
                text: text.toLowerCase(),
                y: -50,
                element: element
            });
        }

        function update(timestamp) {
            if (!gameActive) return;

            // Handle Spawning
            if (timestamp - lastSpawn > spawnRate) {
                spawnWord();
                lastSpawn = timestamp;
            }

            // Move Words
            for (let i = words.length - 1; i >= 0; i--) {
                const w = words[i];
                w.y += fallSpeed;
                w.element.style.top = w.y + 'px';

                // Game Over Condition
                if (w.y > gameContainer.clientHeight - 80) {
                    endGame();
                    return;
                }
            }

            requestAnimationFrame(update);
        }

        function cheerMascot() {
            pixelCat.classList.add('cheer');
            speechBubble.innerText = cheers[Math.floor(Math.random() * cheers.length)];
            speechBubble.style.display = 'block';
            
            setTimeout(() => {
                pixelCat.classList.remove('cheer');
                speechBubble.style.display = 'none';
            }, 600);
        }

        function handleInput() {
            const typedText = wordInput.value.toLowerCase().trim();
            
            const matchIndex = words.findIndex(w => w.text === typedText);
            
            if (matchIndex !== -1) {
                // Correct word!
                words[matchIndex].element.remove();
                words.splice(matchIndex, 1);
                wordInput.value = '';
                
                score += 10;
                scoreDisplay.innerText = score;
                
                cheerMascot();

                // Level up mechanics
                if (score > 0 && score % 100 === 0) {
                    levelUp();
                }
            }
        }

        function levelUp() {
            level++;
            levelDisplay.innerText = level;
            fallSpeed += 0.4;
            spawnRate = Math.max(1000, spawnRate - 200);
            
            // Flash effect for level up
            levelDisplay.style.color = 'red';
            setTimeout(() => levelDisplay.style.color = 'black', 1000);
        }

        function endGame() {
            gameActive = false;
            gameOverScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = `You typed ${score/10} words!`;
        }

        wordInput.addEventListener('input', handleInput);
        startBtn.addEventListener('click', start);
        restartBtn.addEventListener('click', start);

        // Keep focus on input
        document.addEventListener('click', () => {
            if (gameActive) wordInput.focus();
        });
    </script>
</body>
</html>

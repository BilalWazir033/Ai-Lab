<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Typing Adventure</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(#8fd3ff,#dff7ff);
    overflow:hidden;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    z-index:100;
    font-size:22px;
    font-weight:bold;
}

#inputBox{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:300px;
    padding:12px;
    font-size:28px;
    text-align:center;
    border-radius:15px;
    border:4px solid #444;
    outline:none;
}

.word{
    position:absolute;
    font-size:34px;
    font-weight:bold;
    color:#2b2b2b;
    text-shadow:1px 1px white;
    user-select:none;
}

#cat{
    position:absolute;
    bottom:80px;
    left:20px;
    font-size:100px;
    transition:.3s;
}

#speech{
    position:absolute;
    bottom:185px;
    left:80px;
    background:white;
    padding:12px 18px;
    border-radius:15px;
    font-size:24px;
    font-weight:bold;
    min-width:180px;
}

#levelBanner{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:70px;
    color:white;
    text-shadow:3px 3px black;
    display:none;
}

#gameOver{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.7);
    color:white;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:42px;
    z-index:999;
}

button{
    margin-top:20px;
    font-size:30px;
    padding:12px 25px;
    cursor:pointer;
    border:none;
    border-radius:15px;
    background:#ffcc44;
}
</style>
</head>

<body>

<div id="game">

<div id="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div>❤️ Lives: <span id="lives">5</span></div>
<div>🚀 Level: <span id="level">1</span></div>
</div>

<div id="cat">🐱</div>
<div id="speech">Let's Play!</div>

<div id="levelBanner"></div>

<input id="inputBox" autocomplete="off" placeholder="Type here...">

<div id="gameOver">
<div>🎉 Game Over</div>
<div id="finalScore"></div>
<button onclick="restart()">Play Again</button>
</div>

</div>

<script>

const words=[
"cat","dog","sun","hat","fish","red","blue","star",
"book","tree","apple","ball","bird","moon","cake",
"milk","frog","train","happy","smile","jump","green",
"home","duck","water","robot","rocket","tiger","zebra",
"pencil","school","banana","cookie","flower","panda",
"guitar","orange","rainbow","monster","dinosaur"
];

const cheers=[
"Great Job!",
"Awesome!",
"Fantastic!",
"You did it!",
"Meow! Nice!",
"Super!",
"Wow!",
"Excellent!"
];

let score=0;
let lives=5;
let level=1;
let speed=1;
let spawnRate=1700;

const active=[];

const input=document.getElementById("inputBox");
const speech=document.getElementById("speech");

function randomWord(){
    return words[Math.floor(Math.random()*words.length)];
}

function spawnWord(){

    const div=document.createElement("div");
    div.className="word";
    div.textContent=randomWord();

    div.style.left=Math.random()*(window.innerWidth-120)+"px";
    div.style.top="-40px";

    document.getElementById("game").appendChild(div);

    active.push({
        el:div,
        y:-40,
        speed:(1+Math.random())*speed
    });
}

let spawnTimer=setInterval(spawnWord,spawnRate);

function gameLoop(){

    for(let i=active.length-1;i>=0;i--){

        const w=active[i];
        w.y+=w.speed;
        w.el.style.top=w.y+"px";

        if(w.y>window.innerHeight-120){

            w.el.remove();
            active.splice(i,1);

            lives--;
            updateHUD();

            speech.innerHTML="😿 Oops!";

            if(lives<=0){
                endGame();
            }
        }
    }

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

input.addEventListener("input",()=>{

    const text=input.value.trim().toLowerCase();

    for(let i=0;i<active.length;i++){

        if(active[i].el.textContent===text){

            active[i].el.remove();
            active.splice(i,1);

            score++;

            speech.innerHTML=cheers[Math.floor(Math.random()*cheers.length)];

            input.value="";

            updateHUD();

            if(score%10===0){
                levelUp();
            }

            break;
        }
    }

});

function updateHUD(){
    scoreSpan.textContent=score;
    livesSpan.textContent=lives;
    levelSpan.textContent=level;
}

const scoreSpan=document.getElementById("score");
const livesSpan=document.getElementById("lives");
const levelSpan=document.getElementById("level");

function levelUp(){

    level++;

    speed+=0.7;

    spawnRate=Math.max(500,spawnRate-180);

    clearInterval(spawnTimer);
    spawnTimer=setInterval(spawnWord,spawnRate);

    levelSpan.textContent=level;

    const banner=document.getElementById("levelBanner");
    banner.innerHTML="LEVEL "+level+"!";
    banner.style.display="block";

    speech.innerHTML="🎉 Faster now!";

    setTimeout(()=>{
        banner.style.display="none";
    },1800);

}

function endGame(){

    clearInterval(spawnTimer);

    document.getElementById("gameOver").style.display="flex";
    document.getElementById("finalScore").innerHTML="Score: "+score;

    input.disabled=true;

}

function restart(){

    location.reload();

}

input.focus();

</script>

</body>
</html>
